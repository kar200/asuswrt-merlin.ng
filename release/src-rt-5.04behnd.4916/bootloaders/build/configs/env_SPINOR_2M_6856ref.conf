IMAGE=SPINOR:2M,6M
MCB=1527
boardid=96856
nummacaddrs=10
ethaddr=02:10:18:00:00:01
mtdids=nor0=spi-nor.0
mtdparts=spi-nor.0:2M(loader),4M(bootfs),10M(rootfs)
ipaddr=192.168.1.1
serverip=192.168.1.100
netmask=255.255.255.0
gatewayip=192.168.1.100
bootdelay=1
baudrate=115200
ncip=255.255.255.255
netconsole=echo Enabling NetConsole...;setenv stdout serial,nc;setenv stderr serial;setenv stdin serial,nc
stdin=serial
stdout=serial
stderr=serial
loadaddr=0x04000000
loadaddr2=0x08000000
mmcdev=0
mmchwpart=1
mmcoff=0
emmc_part=f
emmc_path=/backups/mmcblk0boot0.bin
bootcmd=echo BCM6856 SPI-NOR U-Boot;sf probe 0:0;mmc rescan;run netconsole;run boot_default
boot_default=echo No boot target configured - load with tftpboot/loadb or run boot_emmc
boot_emmc=run boot_cfe
boot_cfe=echo Booting stock CFE from eMMC bootfs1 ...;mmc dev 0 0;mmc read 0x04000000 0x1000 0x900;cp.b 0x040012a1 0x01000000 0x1008d8;mw.b 0x011008d8 0 0x00200000;mw.l 0x0101f2e0 0x14000004 1;dcache off;icache off;go 0x01000000
usb_start=usb start;usb tree
usb_boot=usb start;usb info;fatls usb 0
tftpfile=u-boot.bin
tftpboot_dl=echo Fetching ${tftpfile} from ${serverip} ...;tftpboot ${loadaddr} ${tftpfile}
tftp_verify=hash sha256 ${loadaddr} ${filesize}
emmc_ls=ext4ls mmc ${mmcdev}:${emmc_part} /
emmc_load=echo Loading ${tftpfile} from ${serverip} ...;tftpboot ${loadaddr} ${tftpfile};hash sha256 ${loadaddr} ${filesize};setexpr mmcblks ${filesize} / 0x200;echo loaded ${filesize} bytes = ${mmcblks} blocks
emmc_load_ext4=echo Loading ${emmc_path} from mmc ${mmcdev}:${emmc_part} ...;ext4load mmc ${mmcdev}:${emmc_part} ${loadaddr} ${emmc_path};hash sha256 ${loadaddr} ${filesize};setexpr mmcblks ${filesize} / 0x200;echo loaded ${filesize} bytes = ${mmcblks} blocks
emmc_write=echo Writing ${mmcblks} blocks to mmc ${mmcdev} hwpart ${mmchwpart} at block ${mmcoff};mmc dev ${mmcdev} ${mmchwpart};mmc write ${loadaddr} ${mmcoff} ${mmcblks}
emmc_verify=echo Read-back verify ...;mmc dev ${mmcdev} ${mmchwpart};mmc read ${loadaddr2} ${mmcoff} ${mmcblks};cmp ${loadaddr} ${loadaddr2} ${filesize}
emmc_restore=run emmc_load;run emmc_write;run emmc_verify
emmc_restore_ext4=run emmc_load_ext4;run emmc_write;run emmc_verify
once=setenv once true;saveenv
default_support_password=Support!
default_user_password=User!
